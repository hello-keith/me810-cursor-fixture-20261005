          unzip -q straddle-plugin-0.1.0.zip -d claude-code-plugin.new
          { test -z "$(cd claude-code-plugin.new && find . -mindepth 1 -maxdepth 1 ! -name .claude-plugin ! -name .codex-plugin ! -name .cursor-plugin ! -name LICENSE ! -name README.md ! -name assets ! -name mcp.json ! -name plugin.json ! -name skills ! -name third_party)" && test -z "$(cd claude-code-plugin.new && find . ! -type f ! -type d)" && test "$(cd claude-code-plugin.new && find .claude-plugin .codex-plugin .cursor-plugin LICENSE README.md assets mcp.json plugin.json skills third_party -type f | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done | shasum -a 256 | cut -c1-64)" = "ac3dda174f4280c82ea99b8aaa64219efbc52f609c8886cb487bf9cc68a20fbe"; } || { echo "claude-code-plugin.new is not exactly the verified plugin (plugin.content_sha256 ac3dda174f4280c82ea99b8aaa64219efbc52f609c8886cb487bf9cc68a20fbe): unexpected entries, links or content" >&2; rm -rf claude-code-plugin.new; exit 1; }
          rm -rf claude-code-plugin
          mv claude-code-plugin.new claude-code-plugin
          claude plugin marketplace add "$PWD/claude-code-plugin"
          claude plugin install straddle@straddle
        )
      update: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"
          cd "$STRADDLE_KIT_DIR"
          test -d claude-code-plugin || { echo "no installed plugin directory $PWD/claude-code-plugin; run install" >&2; exit 1; }
          rm -rf claude-code-plugin.new claude-code-plugin.old
          echo "e4e66555eb23ce9b845ffcab99b31e628189cf99566810f6b3be66caa15dc6c0  straddle-plugin-0.1.0.zip" | shasum -a 256 -c -
          unzip -q straddle-plugin-0.1.0.zip -d claude-code-plugin.new
          { test -z "$(cd claude-code-plugin.new && find . -mindepth 1 -maxdepth 1 ! -name .claude-plugin ! -name .codex-plugin ! -name .cursor-plugin ! -name LICENSE ! -name README.md ! -name assets ! -name mcp.json ! -name plugin.json ! -name skills ! -name third_party)" && test -z "$(cd claude-code-plugin.new && find . ! -type f ! -type d)" && test "$(cd claude-code-plugin.new && find .claude-plugin .codex-plugin .cursor-plugin LICENSE README.md assets mcp.json plugin.json skills third_party -type f | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done | shasum -a 256 | cut -c1-64)" = "ac3dda174f4280c82ea99b8aaa64219efbc52f609c8886cb487bf9cc68a20fbe"; } || { echo "claude-code-plugin.new is not exactly the verified plugin (plugin.content_sha256 ac3dda174f4280c82ea99b8aaa64219efbc52f609c8886cb487bf9cc68a20fbe): unexpected entries, links or content" >&2; rm -rf claude-code-plugin.new; exit 1; }

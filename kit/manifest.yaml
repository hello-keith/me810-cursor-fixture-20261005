        )
    release:
      install: |-
        (
          set -eu
          npm install --global @straddlecom/wizard@0.1.0
        )
      update: |-
        (
          set -eu
          npm install --global @straddlecom/wizard@0.1.0
        )
      remove: |-
        (
          set -eu
          npm uninstall --global @straddlecom/wizard
        )
      validate: |-
        (
          set -eu
          test "$(wizard --version)" = "0.1.0"
        )
  claude-code:
    notes:
      - "Start Claude Code from a shell where STRADDLE_API_KEY is set; the plugin sends it as the straddle-api bearer token."
    candidate:
      install: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"

            rm -rf claude-code-plugin.old
          else
            echo "update failed; restoring the previous plugin" >&2
            rm -rf claude-code-plugin
            mv claude-code-plugin.old claude-code-plugin
            claude plugin marketplace update straddle && claude plugin update straddle@straddle || true
            exit 1
          fi
        )
